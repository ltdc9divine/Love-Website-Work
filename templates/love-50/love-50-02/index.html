<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Letter</title><link rel="stylesheet" href="./style.css"></head><body><main class="letter-world"><header class="letter-intro"><p class="postmark">PRIVATE MAIL / 02</p><h1>To <span id="result-receiver-name"></span>,</h1><p class="from-line">a letter from <strong id="result-sender-name"></strong></p><button class="open-letter" id="open-letter" type="button"><span class="envelope"><i></i><b>OPEN</b></span><span>tap to unfold</span></button></header><section class="letter-sheet" id="letter-sheet"><p class="letter-date" id="result-date"></p><h2>Dear you,</h2><p class="letter-lead" id="result-message"></p><p id="result-letter"></p><p class="letter-signoff">Always yours,<br><strong id="letter-signature"></strong></p></section><section class="letter-memories" id="album-section" hidden><h2>kept between these pages</h2><div id="result-album"></div></section><section class="letter-timeline" id="timeline-section" hidden><h2>the dates I keep</h2><div id="timeline-list"></div></section><footer><p id="final-message"></p><span>sealed with love</span></footer></main><script src="./config.js"></script><script src="./script.js"></script></body></html>
