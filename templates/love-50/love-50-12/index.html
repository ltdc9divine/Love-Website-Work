<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch của chúng mình</title><link rel="stylesheet" href="./style.css"></head><body><main class="planner"><header class="planner-head"><p class="eyebrow">MỘT NĂM CỦA CHÚNG MÌNH / 12</p><h1><span id="result-sender-name"></span> <i>♥</i> <span id="result-receiver-name"></span></h1><p id="result-message"></p><div class="anniversary"><span>NGÀY CÂU CHUYỆN BẮT ĐẦU</span><strong id="result-date"></strong></div></header><section class="calendar-card"><div class="calendar-tools"><button id="previous-month" type="button" aria-label="Tháng trước">←</button><h2 id="month-label"></h2><button id="next-month" type="button" aria-label="Tháng sau">→</button></div><div class="weekdays"><span>THỨ HAI</span><span>THỨ BA</span><span>THỨ TƯ</span><span>THỨ NĂM</span><span>THỨ SÁU</span><span>THỨ BẢY</span><span>CHỦ NHẬT</span></div><div class="calendar-grid" id="calendar-grid"></div><p class="calendar-hint" id="calendar-hint">Ngày của chúng mình được đánh dấu bằng trái tim.</p></section><section class="planner-note"><p class="eyebrow">LỜI NHẮN</p><h2>Một ngày đáng để nhớ.</h2><p id="result-letter"></p></section><section class="milestones" id="timeline-section" hidden><p class="eyebrow">GHI CHÚ KỶ NIỆM</p><div id="timeline-list"></div></section><section class="planner-album" id="album-section" hidden><p class="eyebrow">HÌNH ẢNH KỶ NIỆM</p><div id="result-album"></div></section><footer><strong id="counter-days">0</strong><span>ngày trên lịch của chúng mình</span><p id="final-message"></p></footer></main><script src="./config.js"></script><script src="./script.js"></script></body></html>
